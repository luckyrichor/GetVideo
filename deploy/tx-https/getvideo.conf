# Deployed on tx, 2026-09-30. Access credential is provisioned separately.
# Business service remains at 127.0.0.1:8900.
server {
    listen 80;
    server_name getvideo.example.com;
    location /.well-known/acme-challenge/ { root /var/lib/getvideo-acme; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name getvideo.example.com;
    ssl_certificate /etc/letsencrypt/live/getvideo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getvideo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location = /health {
        proxy_pass http://127.0.0.1:8900;
    }
    # New mobile endpoints authenticate their own account session in FastAPI.
    # The OAuth browser callback cannot carry the device's nginx Basic credentials.
    location = /account/platform-auth/douyin/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/(account/(register|login|me|logout|platforms|platform-bindings|platform-bindings/(bilibili|douyin)/unbind|platform-auth/(start|status|image|complete|cancel|douyin/callback))$|v2/|agent/v2/) {
        proxy_pass http://127.0.0.1:8900;
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        auth_basic "GetVideo";
        auth_basic_user_file /etc/nginx/getvideo.htpasswd;
        proxy_pass http://127.0.0.1:8900;
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
