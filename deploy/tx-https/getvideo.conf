# GetVideo has an independent TLS key/certificate and HTTPS port.
# IP certificate validation uses TX's existing HTTP ACME webroot; no port 80 takeover.
server {
    listen 8443 ssl;
    server_name 43.142.37.199;
    ssl_certificate /etc/getvideo-letsencrypt/live/getvideo-tx/fullchain.pem;
    ssl_certificate_key /etc/getvideo-letsencrypt/live/getvideo-tx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    # Stream video uploads without buffering hundreds of MB inside nginx.
    location = /v2/recreations/upload {
        client_max_body_size 256m;
        proxy_request_buffering off;
        proxy_read_timeout 240s;
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8900;
    }
    # New mobile endpoints authenticate their own account session in FastAPI.
    # The OAuth browser callback cannot carry the device's nginx Basic credentials.
    location = /account/platform-auth/douyin/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/(account/(register|login|me|logout|platforms|platform-bindings|platform-bindings/(bilibili|douyin)/unbind|platform-auth/(start|status|image|complete|cancel|douyin/callback))$|v2/|agent/v2/) {
        proxy_pass http://127.0.0.1:8900;
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        auth_basic "GetVideo";
        auth_basic_user_file /etc/nginx/getvideo.htpasswd;
        proxy_pass http://127.0.0.1:8900;
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
