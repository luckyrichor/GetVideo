# Include INSIDE the existing 43.142.37.199:443 server. Do not create a competing server.
location = /getvideo { return 308 /getvideo/; }
location ^~ /getvideo/ {
    # ^~ prevents GetAudio's sibling regex locations from capturing this project.
    # Strip the public mount once; keep existing backend routes and JSON resource paths.
    rewrite ^/getvideo/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8900;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /getvideo;
    proxy_read_timeout 240s;
    proxy_buffering off;
    auth_basic "GetVideo";
    auth_basic_user_file /etc/nginx/getvideo.htpasswd;

    location = /getvideo/health {
        auth_basic off;
        rewrite ^/getvideo/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8900;
    }
    location = /getvideo/account/platform-auth/douyin/callback {
        auth_basic off;
        access_log off;
        rewrite ^/getvideo/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8900;
    }
    location = /getvideo/v2/recreations/upload {
        auth_basic off;
        client_max_body_size 256m;
        proxy_request_buffering off;
        rewrite ^/getvideo/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8900;
    }
    location ~ ^/getvideo/(account/(register|login|me|logout|platforms|platform-bindings|platform-bindings/(bilibili|douyin)/unbind|platform-auth/(start|status|image|complete|cancel))$|v2/|agent/v2/) {
        auth_basic off;
        rewrite ^/getvideo/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8900;
    }
}
