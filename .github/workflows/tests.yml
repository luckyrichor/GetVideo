name: Tests
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ffmpeg 是测试必需、镜像又不自带，只能 apt 装（**不要用 johnvansickle 的静态构建**：
      # 它没编 chromaprint，而 tests/test_fingerprint.py 要用 `-f chromaprint`，会直接跑挂）。
      # azure 的 apt 镜像偶发慢到离谱（2026-10-27 实测 8 分钟没下完 46 个包，把 job 拖超时），
      # 所以留足超时并加下载重试。
      - name: 安装 ffmpeg
        timeout-minutes: 15
        run: |
          set -e
          if command -v ffmpeg; then echo "镜像已自带 ffmpeg，跳过安装"; exit 0; fi
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      # 不跑 assembleRelease：正式包的签名密钥只在本机（~/.android-keys）和服务器备份里，
      # 按设计不进 CI。release 构建缺密钥会直接失败（见 docs/android-release-signing.md）。
      - run: ./gradlew testDebugUnitTest assembleDebug --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: GetVideo-debug-apks
          path: android/app/build/outputs/apk/**/*.apk
